# Run cdin against your local X11 display:
#   xhost +local:docker     # once per session — let the container use X
#   docker compose up --build
services:
  cdin:
    image: bitsgenix/cdin:latest
    build: .
    environment:
      DISPLAY: ":0"
    volumes:
      # X11 socket (read-only is enough)
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      # GPU passthrough — uncomment for hardware acceleration:
      # - /dev/dri:/dev/dri
    ipc: host # shared memory (MIT-SHM) must come from the host

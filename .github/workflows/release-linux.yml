name: Release – Linux

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}
  workflow_call:
    outputs:
      artifact-name:
        description: "Name of the uploaded artifact"
        value: ${{ jobs.build-linux.outputs.artifact-name }}

permissions:
  contents: read

concurrency:
  group: release-linux-${{ github.ref }}-${{ github.workflow_ref }}
  cancel-in-progress: true

env:
  SDL_VERSION: "3.2.14"

jobs:
  build-linux:
    name: Build (Linux x86_64)
    runs-on: ubuntu-22.04
    outputs:
      artifact-name: cdin-linux-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc make pkg-config python3 python3-pip \
            librsvg2-bin \
            liblua5.4-dev \
            cmake ninja-build \
            libwayland-dev libxkbcommon-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            libpulse-dev libasound2-dev \
            libdbus-1-dev libx11-dev libxext-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            wget ca-certificates

      - name: Build & install SDL3
        run: |
          wget -q "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL3-${SDL_VERSION}.tar.gz"
          tar xf "SDL3-${SDL_VERSION}.tar.gz"
          cmake -S "SDL3-${SDL_VERSION}" -B /tmp/sdl3-build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF \
            -DSDL_TEST=OFF  -DSDL_TESTS=OFF
          sudo cmake --build /tmp/sdl3-build --parallel $(nproc)
          sudo cmake --install /tmp/sdl3-build
          sudo ldconfig
          echo "SDL3 installed: $(pkg-config --modversion sdl3)"

      - name: Generate icon assets
        run: |
          pip install --quiet Pillow
          mkdir -p scripts/icons
          for sz in 16 22 24 32 48 64 128 256 512 1024; do
            rsvg-convert -w "$sz" -h "$sz" scripts/icon.svg \
              -o "scripts/icons/cdin-${sz}.png"
          done
          python3 scripts/gen_icon.py \
                        scripts/icon.svg \
            --out-inl        src/icon.inl \
            --out-dir scripts/icons
          PNG_COUNT=$(find scripts/icons -name 'cdin-*.png' 2>/dev/null | wc -l)
          if [[ "$PNG_COUNT" -eq 0 ]]; then
            echo "::error::Icon PNGs were not generated"
            exit 1
          fi
          echo "Generated ${PNG_COUNT} PNG icons:"
          ls -lh scripts/icons/

      - name: Build release binary
        run: make -j$(nproc) BUILD=release PLATFORM=linux SDL_VERSION=3

      - name: Verify binary
        run: |
          BIN="$(find build/linux-release -maxdepth 1 -name 'cdin' | head -1)"
          if [[ -z "$BIN" ]]; then
            echo "::error::Binary not found under build/linux-release/"
            find build/ -type f 2>/dev/null || echo "(build/ empty)"
            exit 1
          fi
          file "$BIN"
          echo "Binary: $BIN  ($(du -sh "$BIN" | cut -f1))"
          echo "BIN_PATH=$BIN" >> "$GITHUB_ENV"

      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VER="${GITHUB_REF#refs/tags/}"
          else
            VER="dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Package tarball
        run: |
          VER="${{ steps.version.outputs.version }}"
          PKG_NAME="cdin-${VER}-linux-x86_64"
          PKG_DIR="dist/${PKG_NAME}"

          mkdir -p "${PKG_DIR}/bin"
          cp "${BIN_PATH}" "${PKG_DIR}/bin/cdin"
          chmod 755 "${PKG_DIR}/bin/cdin"

          [[ -d data ]] && cp -a data/. "${PKG_DIR}/bin/data/"

          mkdir -p "${PKG_DIR}/scripts"
          cp -r scripts/icons "${PKG_DIR}/scripts/"
          [[ -f scripts/icon.svg ]] && cp scripts/icon.svg "${PKG_DIR}/scripts/"

          cp scripts/cdin.py "${PKG_DIR}/"
          cp -r scripts/_cdin "${PKG_DIR}/"

          for f in README.md CHANGELOG.md LICENSE NOTICE; do
            [[ -f "$f" ]] && cp "$f" "${PKG_DIR}/"
          done

          tar -C dist -czf "dist/${PKG_NAME}.tar.gz" "${PKG_NAME}"
          echo "Tarball: $(du -sh dist/${PKG_NAME}.tar.gz | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdin-linux-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
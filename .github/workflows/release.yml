name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  SDL_VERSION: "3.2.14"

# ═══════════════════════════════════════════════════════════════════════════════
# Job 1a – Linux x86_64
# ═══════════════════════════════════════════════════════════════════════════════
jobs:
  build-linux:
    name: Build – Linux x86_64
    runs-on: ubuntu-22.04
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install apt dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc make pkg-config python3 \
            librsvg2-bin \
            liblua5.4-dev \
            cmake ninja-build \
            libwayland-dev libxkbcommon-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            libpulse-dev libasound2-dev \
            libdbus-1-dev \
            libx11-dev libxext-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev \
            wget ca-certificates

      - name: Build & install SDL3
        run: |
          wget -q "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL3-${SDL_VERSION}.tar.gz"
          tar xf "SDL3-${SDL_VERSION}.tar.gz"
          cmake -S "SDL3-${SDL_VERSION}" -B /tmp/sdl3-build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF \
            -DSDL_TEST=OFF  -DSDL_TESTS=OFF
          sudo cmake --build /tmp/sdl3-build --parallel $(nproc)
          sudo cmake --install /tmp/sdl3-build
          sudo ldconfig
          pkg-config --modversion sdl3

      - name: Generate icon assets
        run: |
          mkdir -p scripts/icons
          for sz in 16 22 24 32 48 64 128 256 512 1024; do
            rsvg-convert -w "$sz" -h "$sz" scripts/icon.svg -o "scripts/icons/cdin-${sz}.png"
          done
          python3 scripts/gen_icon.py \
            --svg       scripts/icon.svg \
            --out       src/icon.inl \
            --icons-dir scripts/icons
          PNG_COUNT=$(find scripts/icons -name 'cdin-*.png' 2>/dev/null | wc -l)
          if [[ "$PNG_COUNT" -eq 0 ]]; then
            echo "::error::Icon PNGs were not generated"
            exit 1
          fi
          echo "Generated ${PNG_COUNT} PNG icons"

      - name: make
        run: make -j$(nproc) BUILD=release PLATFORM=linux SDL_VERSION=3

      - name: Verify binary
        run: |
          BIN="$(find build/linux-release -maxdepth 1 -name 'cdin' | head -1)"
          [[ -z "$BIN" ]] && { echo "::error::Binary not found"; find build/ -type f; exit 1; }
          file "$BIN"
          echo "BIN=$BIN" >> "$GITHUB_ENV"

      - name: Resolve version
        id: ver
        run: |
          VER="${GITHUB_REF#refs/tags/}"
          [[ "$VER" == refs/* ]] && VER="dev-$(git rev-parse --short HEAD)"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Package
        run: |
          VER="${{ steps.ver.outputs.version }}"
          NAME="cdin-${VER}-linux-x86_64"
          DIR="dist/${NAME}"
          mkdir -p "${DIR}/bin"

          cp "$BIN"        "${DIR}/bin/cdin"
          chmod 755        "${DIR}/bin/cdin"
          [[ -d data ]] && cp -r data "${DIR}/bin/"

          # Bundle pre-rendered PNGs so install.sh needs no external converter
          mkdir -p "${DIR}/scripts"
          cp -r scripts/icons "${DIR}/scripts/"
          [[ -f scripts/icon.svg ]] && cp scripts/icon.svg "${DIR}/scripts/"

          cp scripts/install.sh "${DIR}/"
          chmod 755 "${DIR}/install.sh"
          for f in README.md CHANGELOG.md LICENSE NOTICE; do
            [[ -f "$f" ]] && cp "$f" "${DIR}/"
          done

          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          echo "Tarball: $(du -sh dist/${NAME}.tar.gz | cut -f1)"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: dist/*.tar.gz
          if-no-files-found: warn
          retention-days: 14

  # ═══════════════════════════════════════════════════════════════════════════
  # Job 1b – Windows x86_64 (MinGW-w64 via MSYS2)
  # ═══════════════════════════════════════════════════════════════════════════
  build-windows:
    name: Build – Windows x86_64
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-python
            mingw-w64-x86_64-lua
            mingw-w64-x86_64-librsvg
            mingw-w64-x86_64-python-pillow
            mingw-w64-x86_64-python-cairo  
            mingw-w64-x86_64-cairo
            make
            git
            unzip
            zip
            curl

      - name: Install SDL3 (MinGW pre-built)
        run: |
          ZIP="SDL3-devel-${SDL_VERSION}-mingw.zip"
          URL="https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/${ZIP}"
          curl -fsSL -o "${ZIP}" "${URL}"
          unzip -q "${ZIP}" -d /tmp/sdl3

          ROOT="/tmp/sdl3/SDL3-${SDL_VERSION}/x86_64-w64-mingw32"
          cp -r "${ROOT}/include/"* /mingw64/include/
          cp -r "${ROOT}/lib/"*     /mingw64/lib/
          cp -r "${ROOT}/bin/"*     /mingw64/bin/

          mkdir -p /mingw64/lib/pkgconfig
          cat > /mingw64/lib/pkgconfig/sdl3.pc << PC
          prefix=/mingw64
          exec_prefix=\${prefix}
          libdir=\${prefix}/lib
          includedir=\${prefix}/include

          Name: SDL3
          Description: Simple DirectMedia Layer
          Version: ${SDL_VERSION}
          Libs: -L\${libdir} -lSDL3
          Cflags: -I\${includedir}
          PC
          pkg-config --modversion sdl3

      # Generate icon.inl + PNGs using MSYS2 Python (has Cairo via mingw64)
      - name: Generate icon assets
        run: |
          mkdir -p scripts/icons
          for sz in 16 22 24 32 48 64 128 256 512 1024; do
            rsvg-convert -w "$sz" -h "$sz" scripts/icon.svg -o "scripts/icons/cdin-${sz}.png"
          done
       
          python3 scripts/gen_icon.py \
            --svg       scripts/icon.svg \
            --out       src/icon.inl \
            --icons-dir scripts/icons

          PNG_COUNT=$(find scripts/icons -name 'cdin-*.png' 2>/dev/null | wc -l)
          if [[ "$PNG_COUNT" -eq 0 ]]; then
            echo "::error::Icon PNGs were not generated"
            exit 1
          fi
          echo "Generated ${PNG_COUNT} PNG icons"

      # Build .ico from the PNGs we just generated (pure Python, no Cairo needed here)
      - name: Build cdin.ico
        run: |
          python3 - << 'PYEOF'
          import struct, io, os
          from PIL import Image

          sizes = [256, 64, 48, 32, 16]
          ico_dir = "scripts/icons"
          out_path = "scripts/cdin.ico"

          imgs = []
          for sz in sizes:
              png_path = os.path.join(ico_dir, f"cdin-{sz}.png")
              with open(png_path, "rb") as f:
                  imgs.append((sz, Image.open(f).convert("RGBA")))

          n = len(imgs)
          header = struct.pack("<HHH", 0, 1, n)
          dirs = b""
          data = b""
          offset = 6 + 16 * n

          for sz, img in imgs:
              buf = io.BytesIO()
              img.save(buf, "PNG")
              png = buf.getvalue()
              bw = sz if sz < 256 else 0
              dirs += struct.pack("<BBBBHHII", bw, bw, 0, 0, 1, 32, len(png), offset)
              data += png
              offset += len(png)

          with open(out_path, "wb") as f:
              f.write(header + dirs + data)

          print(f"cdin.ico written ({os.path.getsize(out_path):,} bytes)")
          PYEOF

      - name: make
        run: |
          mingw32-make -j$(nproc) \
            BUILD=release \
            PLATFORM=windows \
            SDL_VERSION=3 \
            CC=x86_64-w64-mingw32-gcc

      - name: Verify binary
        run: |
          EXE="$(find build/windows-release -maxdepth 1 -name 'cdin.exe' | head -1)"
          [[ -z "$EXE" ]] && { echo "::error::cdin.exe not found"; find build/ -type f; exit 1; }
          file "$EXE"
          echo "EXE=$EXE" >> "$GITHUB_ENV"

      - name: Collect runtime DLLs
        run: |
          DIR="$(dirname "$EXE")"
          SDL_DLL="$(find /mingw64/bin -name 'SDL3.dll' | head -1)"
          LUA_DLL="$(find /mingw64/bin -name 'lua*.dll' | sort | head -1)"
          [[ -n "$SDL_DLL" ]] && { cp "$SDL_DLL" "$DIR/"; echo "SDL3.dll: OK"; } \
                              || echo "::warning::SDL3.dll not found"
          [[ -n "$LUA_DLL" ]] && { cp "$LUA_DLL" "$DIR/"; echo "lua dll: OK"; } \
                              || echo "::warning::Lua DLL not found"

      - name: Resolve version
        id: ver
        run: |
          VER="${GITHUB_REF#refs/tags/}"
          [[ "$VER" == refs/* ]] && VER="dev-$(git rev-parse --short HEAD)"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Package
        run: |
          VER="${{ steps.ver.outputs.version }}"
          NAME="cdin-${VER}-windows-x86_64"
          DIR="dist/${NAME}"
          mkdir -p "${DIR}"

          cp "$EXE"              "${DIR}/cdin.exe"
          EXE_DIR="$(dirname "$EXE")"
          ls "${EXE_DIR}"/*.dll 2>/dev/null && cp "${EXE_DIR}"/*.dll "${DIR}/" || true

          [[ -d data ]] && cp -r data "${DIR}/"

          # Bundle pre-built .ico (install.ps1 uses it for shortcuts)
          [[ -f scripts/cdin.ico ]] && cp scripts/cdin.ico "${DIR}/" && echo "Bundled cdin.ico"

          cp scripts/install.ps1 "${DIR}/"
          for f in README.md CHANGELOG.md LICENSE NOTICE; do
            [[ -f "$f" ]] && cp "$f" "${DIR}/"
          done

          cd dist
          zip -r "${NAME}.zip" "${NAME}/" > /dev/null
          echo "Zip: $(du -sh ${NAME}.zip | cut -f1)"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: dist/*.zip
          if-no-files-found: warn
          retention-days: 14

  # ═══════════════════════════════════════════════════════════════════════════
  # Job 1c – macOS (arm64 + x86_64)
  # ═══════════════════════════════════════════════════════════════════════════
  build-macos:
    name: Build – macOS (arm64 + x86_64)
    runs-on: macos-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies (Homebrew)
        run: |
          brew update --quiet
          brew install \
            lua \
            librsvg \
            pkg-config

      - name: Build & install SDL3
        run: |
          curl -fsSL -o SDL3-src.tar.gz \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL3-${SDL_VERSION}.tar.gz"
          tar xf SDL3-src.tar.gz
          cmake -S "SDL3-${SDL_VERSION}" -B /tmp/sdl3-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF \
            -DSDL_TEST=OFF  -DSDL_TESTS=OFF
          sudo cmake --build /tmp/sdl3-build --parallel $(sysctl -n hw.logicalcpu)
          sudo cmake --install /tmp/sdl3-build
          pkg-config --modversion sdl3

      - name: Generate icon assets
        run: |
          mkdir -p scripts/icons
          for sz in 16 22 24 32 48 64 128 256 512 1024; do
            rsvg-convert -w "$sz" -h "$sz" scripts/icon.svg \
              -o "scripts/icons/cdin-${sz}.png"
          done
          python3 scripts/gen_icon.py \
            --svg       scripts/icon.svg \
            --out       src/icon.inl \
            --icons-dir scripts/icons
          PNG_COUNT=$(find scripts/icons -name 'cdin-*.png' | wc -l | tr -d ' ')
          if [[ "$PNG_COUNT" -eq 0 ]]; then
            echo "::error::Icon PNGs were not generated"
            exit 1
          fi
          echo "Generated ${PNG_COUNT} PNG icons"

      - name: make
        run: |
          make -j$(sysctl -n hw.logicalcpu) \
            BUILD=release \
            PLATFORM=macos \
            SDL_VERSION=3 \
            CC=clang

      - name: Verify binary
        run: |
          BIN="$(find build/macos-release -maxdepth 1 -name 'cdin' | head -1)"
          [[ -z "$BIN" ]] && { echo "::error::Binary not found"; find build/ -type f; exit 1; }
          file "$BIN"
          otool -L "$BIN"
          echo "BIN=$BIN" >> "$GITHUB_ENV"

      - name: Build .icns icon
        run: |
          ICONSET="scripts/cdin.iconset"
          mkdir -p "$ICONSET"
          ICONS=(
            "icon_16x16.png:16"
            "icon_16x16@2x.png:32"
            "icon_32x32.png:32"
            "icon_32x32@2x.png:64"
            "icon_128x128.png:128"
            "icon_128x128@2x.png:256"
            "icon_256x256.png:256"
            "icon_256x256@2x.png:512"
            "icon_512x512.png:512"
            "icon_512x512@2x.png:1024"
          )
          for item in "${ICONS[@]}"; do
            name="${item%%:*}"
            sz="${item##*:}"
            src="scripts/icons/cdin-${sz}.png"
            [[ -f "$src" ]] && cp "$src" "$ICONSET/$name" && echo "  $name ← cdin-${sz}.png"
          done
          iconutil -c icns "$ICONSET" -o scripts/cdin.icns
          echo "cdin.icns: $(du -sh scripts/cdin.icns | cut -f1)"

      - name: Create .app bundle
        run: |
          APP="dist/cdin.app"
          CONTENTS="$APP/Contents"
          MACOS_DIR="$CONTENTS/MacOS"
          RESOURCES="$CONTENTS/Resources"
          mkdir -p "$MACOS_DIR" "$RESOURCES"

          cp "$BIN" "$MACOS_DIR/cdin"
          chmod 755 "$MACOS_DIR/cdin"
          [[ -d data ]] && cp -r data "$MACOS_DIR/"

          [[ -f scripts/cdin.icns ]] && cp scripts/cdin.icns "$RESOURCES/cdin.icns"

          # Bundle libSDL3.dylib so the app works without Homebrew
          SDL_LIB="$(pkg-config --variable=libdir sdl3)/libSDL3.dylib"
          if [[ -f "$SDL_LIB" ]]; then
            cp "$SDL_LIB" "$MACOS_DIR/libSDL3.dylib"
            install_name_tool \
              -change "$(otool -L "$BIN" | grep SDL3 | awk '{print $1}')" \
              "@executable_path/libSDL3.dylib" \
              "$MACOS_DIR/cdin"
            echo "Bundled libSDL3.dylib"
          else
            echo "::warning::libSDL3.dylib not found at $SDL_LIB – bundle may need SDL3 installed"
          fi

          cat > "$CONTENTS/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>              <string>cdin</string>
            <key>CFBundleDisplayName</key>       <string>cdin</string>
            <key>CFBundleIdentifier</key>        <string>io.cdin.editor</string>
            <key>CFBundleVersion</key>           <string>1</string>
            <key>CFBundleShortVersionString</key> <string>1.0</string>
            <key>CFBundleExecutable</key>        <string>cdin</string>
            <key>CFBundleIconFile</key>          <string>cdin</string>
            <key>CFBundlePackageType</key>       <string>APPL</string>
            <key>CFBundleSignature</key>         <string>????</string>
            <key>NSHighResolutionCapable</key>   <true/>
            <key>LSMinimumSystemVersion</key>    <string>12.0</string>
            <key>CFBundleDocumentTypes</key>
            <array>
              <dict>
                <key>CFBundleTypeName</key>      <string>Text File</string>
                <key>CFBundleTypeRole</key>      <string>Editor</string>
                <key>LSItemContentTypes</key>
                <array>
                  <string>public.plain-text</string>
                  <string>public.source-code</string>
                </array>
              </dict>
            </array>
          </dict>
          </plist>
          PLIST

          echo "App bundle:"
          find "$APP" -type f | sort

      - name: Resolve version
        id: ver
        run: |
          VER="${GITHUB_REF#refs/tags/}"
          [[ "$VER" == refs/* ]] && VER="dev-$(git rev-parse --short HEAD)"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Package
        run: |
          VER="${{ steps.ver.outputs.version }}"
          NAME="cdin-${VER}-macos"
          PKG_DIR="dist/${NAME}"
          mkdir -p "${PKG_DIR}"

          cp -r dist/cdin.app "${PKG_DIR}/"
          cp scripts/install.sh "${PKG_DIR}/"
          chmod 755 "${PKG_DIR}/install.sh"
          for f in README.md CHANGELOG.md LICENSE NOTICE; do
            [[ -f "$f" ]] && cp "$f" "${PKG_DIR}/"
          done

          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          echo "Tarball: $(du -sh dist/${NAME}.tar.gz | cut -f1)"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: dist/*.tar.gz
          if-no-files-found: warn
          retention-days: 14

  # ═══════════════════════════════════════════════════════════════════════════
  # Job 2 – Collect all packages and publish GitHub Release
  # ═══════════════════════════════════════════════════════════════════════════
  create-release:
    name: Publish GitHub Release
    needs:
      - build-linux
      - build-windows
      - build-macos
  
    if: always() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
        continue-on-error: true

      - name: Collect release assets
        run: |
          mkdir -p release
          if [[ -d artifacts ]]; then
            find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) \
              -exec cp {} release/ \;
          fi
          echo "Release assets:"
          ls -lh release/ || echo "(none)"

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"


      - name: Determine contributors
        id: contributors
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          REPO="${{ github.repository }}"
          PREV_TAG=$(git tag --sort=v:refname | grep -B1 "^${CURRENT_TAG}$" | head -1)

          if [[ -z "$PREV_TAG" || "$PREV_TAG" == "$CURRENT_TAG" ]]; then
            HEADER="## Contributors"
            CONTRIB=$(gh api "repos/${REPO}/contributors?per_page=100" \
              --jq '.[].login' \
              | grep -v 'github-actions\[bot\]' \
              | sed 's/^/- @/')
          else
            HEADER="## Contributors (${PREV_TAG} → ${CURRENT_TAG})"
            CONTRIB=$(git log "${PREV_TAG}..${CURRENT_TAG}" --format='%H' \
              | while read -r sha; do
                  gh api "repos/${REPO}/commits/${sha}" \
                    --jq '.author.login // empty' 2>/dev/null
                done \
              | grep -v '^$' | grep -v 'github-actions\[bot\]' \
              | sort -u | sed 's/^/- @/')
          fi
          { echo "header=${HEADER}"; echo "list<<EOF"; echo "${CONTRIB}"; echo "EOF"; } \
            >> "$GITHUB_OUTPUT"

      - name: Build release notes
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          CHANGELOG="CHANGELOG.md"

          if [[ -f "$CHANGELOG" ]] && grep -q "## \[${VERSION}\]" "$CHANGELOG"; then
            sed -n "/## \[${VERSION}\]/,/^## \[/p" "$CHANGELOG" | sed '$d' > release_body.md
          else
            printf '## Release %s\n\nSee [CHANGELOG](https://github.com/%s/blob/main/CHANGELOG.md) for details.\n' \
              "${{ github.ref_name }}" "${{ github.repository }}" > release_body.md
          fi

          cat >> release_body.md << NOTES

          ---

          ## Installation

          ### Linux (x86_64)

          \`\`\`bash
          tar xzf cdin-v${VERSION}-linux-x86_64.tar.gz
          cd cdin-v${VERSION}-linux-x86_64
          bash install.sh                         # → ~/.local  (no sudo)
          # or system-wide:
          sudo bash install.sh --prefix=/usr/local
          \`\`\`

          > **SDL3 runtime** — needed at runtime if not already installed:
          > - Ubuntu 24.04+: \`sudo apt install libsdl3-0\`
          > - Other distros: see [SDL3 releases](https://github.com/libsdl-org/SDL/releases)

          ### Windows (x86_64)

          1. Download \`cdin-v${VERSION}-windows-x86_64.zip\` and extract it.
          2. Open **PowerShell** inside the extracted folder and run:

          \`\`\`powershell
          .\install.ps1
          # Optional:
          .\install.ps1 -RegisterFileTypes   # set as default for text/code files
          .\install.ps1 -Prefix C:\Tools\cdin # custom location
          \`\`\`

          > The installer copies \`cdin.exe\`, \`SDL3.dll\`, and the Lua DLL into
          > \`%LOCALAPPDATA%\cdin\bin\` and adds that folder to your **user PATH**.

          ### macOS (arm64 + x86_64)

          \`\`\`bash
          tar xzf cdin-v${VERSION}-macos.tar.gz
          cd cdin-v${VERSION}-macos
          # Run directly:
          open cdin.app
          # Or move to Applications:
          mv cdin.app /Applications/
          \`\`\`

          > SDL3 is **bundled inside** the .app — no Homebrew install needed.

          ---

          ${{ steps.contributors.outputs.header }}

          ${{ steps.contributors.outputs.list }}
          NOTES

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ github.ref_name }}
          name:       "cdin ${{ github.ref_name }}"
          body_path:  release_body.md
          files:      release/*
          draft:      false
          prerelease: false
          discussion_category_name: ${{ steps.discussion.outputs.category }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Delegate builds to the per-platform workflows (no duplication)
  # ─────────────────────────────────────────────────────────────────────────
  build-linux:
    name: Build – Linux x86_64
    uses: ./.github/workflows/release-linux.yml
    permissions:
      contents: read

  build-windows:
    name: Build – Windows x86_64
    uses: ./.github/workflows/release-windows.yml
    permissions:
      contents: read

  build-macos:
    name: Build – macOS DMG (arm64)
    uses: ./.github/workflows/release-macos.yml
    permissions:
      contents: read

  # ─────────────────────────────────────────────────────────────────────────
  # Collect all three packages → publish GitHub Release
  # ─────────────────────────────────────────────────────────────────────────
  create-release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows, build-macos]
    if: always() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
        continue-on-error: true

      - name: Collect release assets
        run: |
          mkdir -p release
          if [[ -d artifacts ]]; then
            find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.dmg' \) \
              -exec cp {} release/ \;
          fi
          echo "Release assets:"
          ls -lh release/ || echo "(none)"

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Determine contributors
        id: contributors
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          REPO="${{ github.repository }}"
          PREV_TAG=$(git tag --sort=v:refname | grep -B1 "^${CURRENT_TAG}$" | head -1)

          if [[ -z "$PREV_TAG" || "$PREV_TAG" == "$CURRENT_TAG" ]]; then
            HEADER="## Contributors"
            CONTRIB=$(gh api "repos/${REPO}/contributors?per_page=100" \
              --jq '.[].login' \
              | grep -v 'github-actions\[bot\]' \
              | sed 's/^/- @/')
          else
            HEADER="## Contributors (${PREV_TAG} → ${CURRENT_TAG})"
            CONTRIB=$(git log "${PREV_TAG}..${CURRENT_TAG}" --format='%H' \
              | while read -r sha; do
                  gh api "repos/${REPO}/commits/${sha}" \
                    --jq '.author.login // empty' 2>/dev/null
                done \
              | grep -v '^$' | grep -v 'github-actions\[bot\]' \
              | sort -u | sed 's/^/- @/')
          fi
          { echo "header=${HEADER}"; echo "list<<EOF"; echo "${CONTRIB}"; echo "EOF"; } \
            >> "$GITHUB_OUTPUT"

      - name: Build release notes
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          CHANGELOG="CHANGELOG.md"

          if [[ -f "$CHANGELOG" ]] && grep -q "## \[${VERSION}\]" "$CHANGELOG"; then
            sed -n "/## \[${VERSION}\]/,/^## \[/p" "$CHANGELOG" | sed '$d' > release_body.md
          else
            printf '## Release %s\n\nSee [CHANGELOG](https://github.com/%s/blob/main/CHANGELOG.md) for details.\n' \
              "${{ github.ref_name }}" "${{ github.repository }}" > release_body.md
          fi

          cat >> release_body.md << 'NOTES'

          ---

          ## Installation

          > **Requires Python 3.8+** — comes pre-installed on all supported platforms.

          ### Linux (x86_64)

          ```bash
          tar xzf cdin-vVERSION-linux-x86_64.tar.gz
          cd cdin-vVERSION-linux-x86_64

          # Interactive (recommended for first-time install):
          python3 cdin.py

          # Or non-interactive:
          python3 cdin.py install                        # → ~/.local  (no sudo)
          python3 cdin.py install --prefix /usr/local    # system-wide (needs sudo)
          python3 cdin.py install --shortcut             # also create .desktop entry
          ```

          > **SDL3 runtime** — needed at runtime if not already installed:
          > - Ubuntu 24.04+: `sudo apt install libsdl3-0`
          > - Other distros: see [SDL3 releases](https://github.com/libsdl-org/SDL/releases)

          ### Windows (x86_64)

          1. Download `cdin-vVERSION-windows-x86_64.zip` and extract it.
          2. Open **PowerShell** or **Command Prompt** inside the extracted folder and run:

          ```powershell
          # Interactive (recommended):
          python cdin.py

          # Or non-interactive:
          python cdin.py install
          python cdin.py install --shortcut              # also create desktop shortcut
          python cdin.py install --register-filetypes    # set as default for text/code files
          python cdin.py install --prefix C:\Tools\cdin  # custom install location
          ```

          > `cdin.exe`, `SDL3.dll`, and the Lua DLL are added to `%LOCALAPPDATA%\cdin\bin`
          > and that folder is added to your **user PATH** automatically.

          ### macOS (arm64)

          1. Download **`cdin-vVERSION-macos.dmg`** and double-click it.
          2. Drag **cdin** into the **Applications** folder shortcut.
          3. Eject the disk image and open cdin from Launchpad or Spotlight.

          > SDL3 is **bundled inside** the .app — no Homebrew or extra installs needed.

          ---

          ## Updating & Uninstalling

          ```bash
          python3 cdin.py update              # update to latest release
          python3 cdin.py update --check      # just check, don't install
          python3 cdin.py update --version 0.2.0

          python3 cdin.py uninstall           # remove installed files
          ```

          ---
          NOTES

          sed -i "s/VERSION/${VERSION}/g" release_body.md

          cat >> release_body.md << NOTES

          ${{ steps.contributors.outputs.header }}

          ${{ steps.contributors.outputs.list }}
          NOTES

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ github.ref_name }}
          name:       "cdin ${{ github.ref_name }}"
          body_path:  release_body.md
          files:      release/*
          draft:      false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
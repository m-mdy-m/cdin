name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  SDL_VERSION: "3.2.14"

# ═══════════════════════════════════════════════════════════════════════════════
# Job 1a – Linux x86_64
# ═══════════════════════════════════════════════════════════════════════════════
jobs:
  build-linux:
    name: Build – Linux x86_64
    runs-on: ubuntu-22.04
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install apt dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc make pkg-config python3 \
            librsvg2-bin \
            liblua5.4-dev \
            cmake ninja-build \
            libwayland-dev libxkbcommon-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            libpulse-dev libasound2-dev \
            libdbus-1-dev \
            libx11-dev libxext-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev \
            wget ca-certificates

      - name: Build & install SDL3
        run: |
          wget -q "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL3-${SDL_VERSION}.tar.gz"
          tar xf "SDL3-${SDL_VERSION}.tar.gz"
          cmake -S "SDL3-${SDL_VERSION}" -B /tmp/sdl3-build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF \
            -DSDL_TEST=OFF  -DSDL_TESTS=OFF
          sudo cmake --build /tmp/sdl3-build --parallel $(nproc)
          sudo cmake --install /tmp/sdl3-build
          sudo ldconfig
          pkg-config --modversion sdl3

      - name: Generate icon assets
        run: |
          mkdir -p scripts/icons
          for sz in 16 22 24 32 48 64 128 256 512 1024; do
            rsvg-convert -w "$sz" -h "$sz" scripts/icon.svg -o "scripts/icons/cdin-${sz}.png"
          done
          python3 scripts/gen_icon.py \
            --svg       scripts/icon.svg \
            --out-inl        src/icon.inl \
            --out-dir scripts/icons
          PNG_COUNT=$(find scripts/icons -name 'cdin-*.png' 2>/dev/null | wc -l)
          if [[ "$PNG_COUNT" -eq 0 ]]; then
            echo "::error::Icon PNGs were not generated"
            exit 1
          fi
          echo "Generated ${PNG_COUNT} PNG icons"

      - name: make
        run: make -j$(nproc) BUILD=release PLATFORM=linux SDL_VERSION=3

      - name: Verify binary
        run: |
          BIN="$(find build/linux-release -maxdepth 1 -name 'cdin' | head -1)"
          [[ -z "$BIN" ]] && { echo "::error::Binary not found"; find build/ -type f; exit 1; }
          file "$BIN"
          echo "BIN=$BIN" >> "$GITHUB_ENV"

      - name: Resolve version
        id: ver
        run: |
          VER="${GITHUB_REF#refs/tags/}"
          [[ "$VER" == refs/* ]] && VER="dev-$(git rev-parse --short HEAD)"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Package
        run: |
          VER="${{ steps.ver.outputs.version }}"
          NAME="cdin-${VER}-linux-x86_64"
          DIR="dist/${NAME}"
          mkdir -p "${DIR}/bin"

          cp "$BIN"        "${DIR}/bin/cdin"
          chmod 755        "${DIR}/bin/cdin"
          [[ -d data ]] && cp -r data "${DIR}/bin/"

          # Bundle pre-rendered PNGs so the installer can set up icons
          mkdir -p "${DIR}/scripts"
          cp -r scripts/icons "${DIR}/scripts/"
          [[ -f scripts/icon.svg ]] && cp scripts/icon.svg "${DIR}/scripts/"

          # Bundle the Python installer (replaces the old install.sh)
          cp scripts/cdin.py "${DIR}/"
          cp -r scripts/_cdin "${DIR}/"

          for f in README.md CHANGELOG.md LICENSE NOTICE; do
            [[ -f "$f" ]] && cp "$f" "${DIR}/"
          done

          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          echo "Tarball: $(du -sh dist/${NAME}.tar.gz | cut -f1)"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: dist/*.tar.gz
          if-no-files-found: warn
          retention-days: 14

  # ═══════════════════════════════════════════════════════════════════════════
  # Job 1b – Windows x86_64 (MinGW-w64 via MSYS2)
  # ═══════════════════════════════════════════════════════════════════════════
  build-windows:
    name: Build – Windows x86_64
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-python
            mingw-w64-x86_64-lua
            mingw-w64-x86_64-librsvg
            mingw-w64-x86_64-python-pillow
            mingw-w64-x86_64-python-cairo
            mingw-w64-x86_64-cairo
            make
            git
            unzip
            zip
            curl

      - name: Install SDL3 (MinGW pre-built)
        run: |
          ZIP="SDL3-devel-${SDL_VERSION}-mingw.zip"
          URL="https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/${ZIP}"
          curl -fsSL -o "${ZIP}" "${URL}"
          unzip -q "${ZIP}" -d /tmp/sdl3

          ROOT="/tmp/sdl3/SDL3-${SDL_VERSION}/x86_64-w64-mingw32"
          cp -r "${ROOT}/include/"* /mingw64/include/
          cp -r "${ROOT}/lib/"*     /mingw64/lib/
          cp -r "${ROOT}/bin/"*     /mingw64/bin/

          mkdir -p /mingw64/lib/pkgconfig
          cat > /mingw64/lib/pkgconfig/sdl3.pc << PC
          prefix=/mingw64
          exec_prefix=\${prefix}
          libdir=\${prefix}/lib
          includedir=\${prefix}/include

          Name: SDL3
          Description: Simple DirectMedia Layer
          Version: ${SDL_VERSION}
          Libs: -L\${libdir} -lSDL3
          Cflags: -I\${includedir}
          PC
          pkg-config --modversion sdl3

      - name: Generate icon assets
        run: |
          mkdir -p scripts/icons
          for sz in 16 22 24 32 48 64 128 256 512 1024; do
            rsvg-convert -w "$sz" -h "$sz" scripts/icon.svg -o "scripts/icons/cdin-${sz}.png"
          done

          python3 scripts/gen_icon.py \
            --svg       scripts/icon.svg \
            --out-inl        src/icon.inl \
            --out-dir scripts/icons

          PNG_COUNT=$(find scripts/icons -name 'cdin-*.png' 2>/dev/null | wc -l)
          if [[ "$PNG_COUNT" -eq 0 ]]; then
            echo "::error::Icon PNGs were not generated"
            exit 1
          fi
          echo "Generated ${PNG_COUNT} PNG icons"

      - name: Build cdin.ico
        run: |
          python3 - << 'PYEOF'
          import struct, io, os
          from PIL import Image

          sizes = [256, 64, 48, 32, 16]
          ico_dir = "scripts/icons"
          out_path = "scripts/cdin.ico"

          imgs = []
          for sz in sizes:
              png_path = os.path.join(ico_dir, f"cdin-{sz}.png")
              with open(png_path, "rb") as f:
                  imgs.append((sz, Image.open(f).convert("RGBA")))

          n = len(imgs)
          header = struct.pack("<HHH", 0, 1, n)
          dirs = b""
          data = b""
          offset = 6 + 16 * n

          for sz, img in imgs:
              buf = io.BytesIO()
              img.save(buf, "PNG")
              png = buf.getvalue()
              bw = sz if sz < 256 else 0
              dirs += struct.pack("<BBBBHHII", bw, bw, 0, 0, 1, 32, len(png), offset)
              data += png
              offset += len(png)

          with open(out_path, "wb") as f:
              f.write(header + dirs + data)

          print(f"cdin.ico written ({os.path.getsize(out_path):,} bytes)")
          PYEOF

      - name: make
        run: |
          mingw32-make -j$(nproc) \
            BUILD=release \
            PLATFORM=windows \
            SDL_VERSION=3 \
            CC=x86_64-w64-mingw32-gcc

      - name: Verify binary
        run: |
          EXE="$(find build/windows-release -maxdepth 1 -name 'cdin.exe' | head -1)"
          [[ -z "$EXE" ]] && { echo "::error::cdin.exe not found"; find build/ -type f; exit 1; }
          file "$EXE"
          echo "EXE=$EXE" >> "$GITHUB_ENV"

      - name: Collect runtime DLLs
        run: |
          DIR="$(dirname "$EXE")"
          SDL_DLL="$(find /mingw64/bin -name 'SDL3.dll' | head -1)"
          LUA_DLL="$(find /mingw64/bin -name 'lua*.dll' | sort | head -1)"
          [[ -n "$SDL_DLL" ]] && { cp "$SDL_DLL" "$DIR/"; echo "SDL3.dll: OK"; } \
                              || echo "::warning::SDL3.dll not found"
          [[ -n "$LUA_DLL" ]] && { cp "$LUA_DLL" "$DIR/"; echo "lua dll: OK"; } \
                              || echo "::warning::Lua DLL not found"

      - name: Resolve version
        id: ver
        run: |
          VER="${GITHUB_REF#refs/tags/}"
          [[ "$VER" == refs/* ]] && VER="dev-$(git rev-parse --short HEAD)"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Package
        run: |
          VER="${{ steps.ver.outputs.version }}"
          NAME="cdin-${VER}-windows-x86_64"
          DIR="dist/${NAME}"
          mkdir -p "${DIR}"

          cp "$EXE"              "${DIR}/cdin.exe"
          EXE_DIR="$(dirname "$EXE")"
          ls "${EXE_DIR}"/*.dll 2>/dev/null && cp "${EXE_DIR}"/*.dll "${DIR}/" || true

          [[ -d data ]] && cp -r data "${DIR}/"

          [[ -f scripts/cdin.ico ]] && cp scripts/cdin.ico "${DIR}/" && echo "Bundled cdin.ico"

          # Bundle the Python installer (replaces the old install.ps1)
          cp scripts/cdin.py "${DIR}/"
          cp -r scripts/_cdin "${DIR}/"

          for f in README.md CHANGELOG.md LICENSE NOTICE; do
            [[ -f "$f" ]] && cp "$f" "${DIR}/"
          done

          cd dist
          zip -r "${NAME}.zip" "${NAME}/" > /dev/null
          echo "Zip: $(du -sh ${NAME}.zip | cut -f1)"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: dist/*.zip
          if-no-files-found: warn
          retention-days: 14

  # ═══════════════════════════════════════════════════════════════════════════
  # Job 1c – macOS DMG (arm64, Rosetta 2 compatible)
  # ═══════════════════════════════════════════════════════════════════════════
  build-macos:
    name: Build – macOS DMG (arm64)
    runs-on: macos-15
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies (Homebrew)
        run: |
          brew update --quiet
          brew install \
            lua \
            librsvg \
            pkg-config \
            create-dmg

      - name: Build & install SDL3
        run: |
          curl -fsSL -o SDL3-src.tar.gz \
            "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL3-${SDL_VERSION}.tar.gz"
          tar xf SDL3-src.tar.gz
          cmake -S "SDL3-${SDL_VERSION}" -B /tmp/sdl3-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF \
            -DSDL_TEST=OFF  -DSDL_TESTS=OFF
          sudo cmake --build /tmp/sdl3-build --parallel $(sysctl -n hw.logicalcpu)
          sudo cmake --install /tmp/sdl3-build
          pkg-config --modversion sdl3 && echo "SDL3 OK"

      - name: Generate icon assets
        run: |
          mkdir -p scripts/icons
          for sz in 16 22 24 32 48 64 128 256 512 1024; do
            rsvg-convert -w "$sz" -h "$sz" scripts/icon.svg \
              -o "scripts/icons/cdin-${sz}.png"
          done
          python3 scripts/gen_icon.py \
            --svg       scripts/icon.svg \
            --out-inl        src/icon.inl \
            --out-dir scripts/icons
          PNG_COUNT=$(find scripts/icons -name 'cdin-*.png' | wc -l | tr -d ' ')
          [[ "$PNG_COUNT" -eq 0 ]] && { echo "::error::Icon PNGs not generated"; exit 1; }
          echo "Generated ${PNG_COUNT} PNG icons"

      - name: Build .icns icon
        run: |
          ICONSET="scripts/cdin.iconset"
          mkdir -p "$ICONSET"

          ICON_NAMES=(
            "icon_16x16.png"
            "icon_16x16@2x.png"
            "icon_32x32.png"
            "icon_32x32@2x.png"
            "icon_128x128.png"
            "icon_128x128@2x.png"
            "icon_256x256.png"
            "icon_256x256@2x.png"
            "icon_512x512.png"
            "icon_512x512@2x.png"
          )
          ICON_SIZES=(16 32 32 64 128 256 256 512 512 1024)

          for i in "${!ICON_NAMES[@]}"; do
            name="${ICON_NAMES[$i]}"
            sz="${ICON_SIZES[$i]}"
            src="scripts/icons/cdin-${sz}.png"
            if [[ -f "$src" ]]; then
              cp "$src" "$ICONSET/$name"
              echo "  $name ← cdin-${sz}.png"
            else
              echo "::warning::Missing icon source: $src"
            fi
          done

          iconutil -c icns "$ICONSET" -o scripts/cdin.icns
          echo "cdin.icns: $(du -sh scripts/cdin.icns | cut -f1)"

      - name: Build release binary
        run: |
          make -j$(sysctl -n hw.logicalcpu) \
            BUILD=release PLATFORM=macos SDL_VERSION=3 CC=clang
          file build/macos-release/cdin
          echo "BIN=build/macos-release/cdin" >> "$GITHUB_ENV"

      - name: Resolve version
        id: ver
        run: |
          VER="${GITHUB_REF#refs/tags/}"
          [[ "$VER" == refs/* ]] && VER="dev-$(git rev-parse --short HEAD)"
          PLIST_VER="${VER#v}"
          echo "version=${VER}"             >> "$GITHUB_OUTPUT"
          echo "plist_version=${PLIST_VER}" >> "$GITHUB_OUTPUT"

      - name: Create .app bundle
        run: |
          APP="dist/cdin.app"
          MACOS_DIR="$APP/Contents/MacOS"
          RESOURCES="$APP/Contents/Resources"
          mkdir -p "$MACOS_DIR" "$RESOURCES"

          cp "$BIN" "$MACOS_DIR/cdin"
          chmod 755 "$MACOS_DIR/cdin"
          [[ -d data ]] && cp -r data "$MACOS_DIR/"

          [[ -f scripts/cdin.icns ]] && cp scripts/cdin.icns "$RESOURCES/cdin.icns"

          SDL_LIB="$(pkg-config --variable=libdir sdl3)/libSDL3.dylib"
          if [[ -f "$SDL_LIB" ]]; then
            cp "$SDL_LIB" "$MACOS_DIR/libSDL3.dylib"
            OLD_PATH="$(otool -L "$MACOS_DIR/cdin" | grep SDL3 | awk '{print $1}')"
            install_name_tool \
              -change "$OLD_PATH" "@executable_path/libSDL3.dylib" \
              "$MACOS_DIR/cdin"
            install_name_tool \
              -id "@executable_path/libSDL3.dylib" \
              "$MACOS_DIR/libSDL3.dylib"
            echo "Bundled + patched libSDL3.dylib"
          else
            echo "::warning::libSDL3.dylib not found – users may need SDL3 installed"
          fi

          PLIST_VER="${{ steps.ver.outputs.plist_version }}"
          cat > "$APP/Contents/Info.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>              <string>cdin</string>
            <key>CFBundleDisplayName</key>       <string>cdin</string>
            <key>CFBundleIdentifier</key>        <string>io.cdin.editor</string>
            <key>CFBundleVersion</key>           <string>${PLIST_VER}</string>
            <key>CFBundleShortVersionString</key> <string>${PLIST_VER}</string>
            <key>CFBundleExecutable</key>        <string>cdin</string>
            <key>CFBundleIconFile</key>          <string>cdin</string>
            <key>CFBundlePackageType</key>       <string>APPL</string>
            <key>CFBundleSignature</key>         <string>????</string>
            <key>NSHighResolutionCapable</key>   <true/>
            <key>LSMinimumSystemVersion</key>    <string>12.0</string>
            <key>LSApplicationCategoryType</key> <string>public.app-category.developer-tools</string>
            <key>CFBundleDocumentTypes</key>
            <array>
              <dict>
                <key>CFBundleTypeName</key> <string>Text File</string>
                <key>CFBundleTypeRole</key> <string>Editor</string>
                <key>LSItemContentTypes</key>
                <array>
                  <string>public.plain-text</string>
                  <string>public.source-code</string>
                </array>
              </dict>
            </array>
          </dict>
          </plist>
          PLIST

          echo "── App bundle ──"
          find "$APP" -type f | sort

      - name: Verify .app binary
        run: |
          BIN_APP="dist/cdin.app/Contents/MacOS/cdin"
          file "$BIN_APP"
          otool -L "$BIN_APP"
          lipo -info "$BIN_APP"

      - name: Create DMG installer
        run: |
          VER="${{ steps.ver.outputs.version }}"
          DMG_NAME="cdin-${VER}-macos"
          DMG_PATH="dist/${DMG_NAME}.dmg"

          create-dmg \
            --volname        "cdin ${VER}" \
            --volicon        "scripts/cdin.icns" \
            --window-pos     200 120 \
            --window-size    660 400 \
            --icon-size      128 \
            --icon           "cdin.app" 180 185 \
            --hide-extension "cdin.app" \
            --app-drop-link  480 185 \
            --no-internet-enable \
            "${DMG_PATH}" \
            "dist/"

          echo "DMG: $(du -sh ${DMG_PATH} | cut -f1)"
          echo "DMG_PATH=${DMG_PATH}" >> "$GITHUB_ENV"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: dist/*.dmg
          if-no-files-found: warn
          retention-days: 14

  # ═══════════════════════════════════════════════════════════════════════════
  # Job 2 – Collect all packages and publish GitHub Release
  # ═══════════════════════════════════════════════════════════════════════════
  create-release:
    name: Publish GitHub Release
    needs:
      - build-linux
      - build-windows
      - build-macos

    if: always() && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
        continue-on-error: true

      - name: Collect release assets
        run: |
          mkdir -p release
          if [[ -d artifacts ]]; then
            find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.dmg' \) \
              -exec cp {} release/ \;
          fi
          echo "Release assets:"
          ls -lh release/ || echo "(none)"

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Determine contributors
        id: contributors
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          REPO="${{ github.repository }}"
          PREV_TAG=$(git tag --sort=v:refname | grep -B1 "^${CURRENT_TAG}$" | head -1)

          if [[ -z "$PREV_TAG" || "$PREV_TAG" == "$CURRENT_TAG" ]]; then
            HEADER="## Contributors"
            CONTRIB=$(gh api "repos/${REPO}/contributors?per_page=100" \
              --jq '.[].login' \
              | grep -v 'github-actions\[bot\]' \
              | sed 's/^/- @/')
          else
            HEADER="## Contributors (${PREV_TAG} → ${CURRENT_TAG})"
            CONTRIB=$(git log "${PREV_TAG}..${CURRENT_TAG}" --format='%H' \
              | while read -r sha; do
                  gh api "repos/${REPO}/commits/${sha}" \
                    --jq '.author.login // empty' 2>/dev/null
                done \
              | grep -v '^$' | grep -v 'github-actions\[bot\]' \
              | sort -u | sed 's/^/- @/')
          fi
          { echo "header=${HEADER}"; echo "list<<EOF"; echo "${CONTRIB}"; echo "EOF"; } \
            >> "$GITHUB_OUTPUT"

      - name: Build release notes
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          CHANGELOG="CHANGELOG.md"

          if [[ -f "$CHANGELOG" ]] && grep -q "## \[${VERSION}\]" "$CHANGELOG"; then
            sed -n "/## \[${VERSION}\]/,/^## \[/p" "$CHANGELOG" | sed '$d' > release_body.md
          else
            printf '## Release %s\n\nSee [CHANGELOG](https://github.com/%s/blob/main/CHANGELOG.md) for details.\n' \
              "${{ github.ref_name }}" "${{ github.repository }}" > release_body.md
          fi

          cat >> release_body.md << 'NOTES'

          ---

          ## Installation

          > **Requires Python 3.8+** — comes pre-installed on all supported platforms.

          ### Linux (x86_64)

          ```bash
          tar xzf cdin-vVERSION-linux-x86_64.tar.gz
          cd cdin-vVERSION-linux-x86_64

          # Interactive (recommended for first-time install):
          python3 cdin.py

          # Or non-interactive:
          python3 cdin.py install                        # → ~/.local  (no sudo)
          python3 cdin.py install --prefix /usr/local    # system-wide (needs sudo)
          python3 cdin.py install --shortcut             # also create .desktop entry
          ```

          > **SDL3 runtime** — needed at runtime if not already installed:
          > - Ubuntu 24.04+: `sudo apt install libsdl3-0`
          > - Other distros: see [SDL3 releases](https://github.com/libsdl-org/SDL/releases)

          ### Windows (x86_64)

          1. Download `cdin-vVERSION-windows-x86_64.zip` and extract it.
          2. Open **PowerShell** or **Command Prompt** inside the extracted folder and run:

          ```powershell
          # Interactive (recommended):
          python cdin.py

          # Or non-interactive:
          python cdin.py install
          python cdin.py install --shortcut              # also create desktop shortcut
          python cdin.py install --register-filetypes    # set as default for text/code files
          python cdin.py install --prefix C:\Tools\cdin  # custom install location
          ```

          > `cdin.exe`, `SDL3.dll`, and the Lua DLL are added to `%LOCALAPPDATA%\cdin\bin`
          > and that folder is added to your **user PATH** automatically.

          ### macOS (arm64)

          1. Download **`cdin-vVERSION-macos.dmg`** and double-click it.
          2. Drag **cdin** into the **Applications** folder shortcut.
          3. Eject the disk image and open cdin from Launchpad or Spotlight.

          > SDL3 is **bundled inside** the .app — no Homebrew or extra installs needed.

          ---

          ## Updating & Uninstalling

          ```bash
          python3 cdin.py update              # update to latest release
          python3 cdin.py update --check      # just check, don't install
          python3 cdin.py update --version 0.2.0

          python3 cdin.py uninstall           # remove installed files
          ```

          ---
          NOTES

          # Substitute the real version into the heredoc above
          sed -i "s/VERSION/${VERSION}/g" release_body.md

          cat >> release_body.md << NOTES

          ${{ steps.contributors.outputs.header }}

          ${{ steps.contributors.outputs.list }}
          NOTES

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ github.ref_name }}
          name:       "cdin ${{ github.ref_name }}"
          body_path:  release_body.md

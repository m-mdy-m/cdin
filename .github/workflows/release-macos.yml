name: Release – macOS

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  SDL_VERSION: "3.2.14"

jobs:
  build-macos:
    name: Build macOS DMG (arm64, Rosetta 2 compatible)
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies (Homebrew)
        run: |
          brew update --quiet
          brew install \
            lua \
            librsvg \
            pkg-config \
            create-dmg

      - name: Install SDL3 from source
        run: |
          SDL_URL="https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL3-${SDL_VERSION}.tar.gz"
          curl -fsSL -o SDL3-src.tar.gz "${SDL_URL}"
          tar xf SDL3-src.tar.gz

          cmake -S "SDL3-${SDL_VERSION}" -B /tmp/sdl3-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF \
            -DSDL_TEST=OFF  -DSDL_TESTS=OFF
          sudo cmake --build /tmp/sdl3-build --parallel $(sysctl -n hw.logicalcpu)
          sudo cmake --install /tmp/sdl3-build

          pkg-config --modversion sdl3 && echo "SDL3 OK"

      - name: Generate PNG icons
        run: |
          mkdir -p scripts/icons
          for sz in 16 22 24 32 48 64 128 256 512 1024; do
            rsvg-convert -w "$sz" -h "$sz" scripts/icon.svg \
              -o "scripts/icons/cdin-${sz}.png"
          done
          echo "Generated $(find scripts/icons -name '*.png' | wc -l | tr -d ' ') PNGs"

      - name: Generate src/icon.inl
        run: |
          python3 scripts/gen_icon.py \
            --svg       scripts/icon.svg \
            --out       src/icon.inl \
            --icons-dir scripts/icons
          echo "icon.inl: $(wc -l < src/icon.inl) lines"

      - name: Build .icns icon
        run: |
          ICONSET="scripts/cdin.iconset"
          mkdir -p "$ICONSET"

          # Parallel arrays — avoids associative array key parsing issues with
          # dots and @ characters on macOS bash (declare -A fails on those keys)
          ICON_NAMES=(
            "icon_16x16.png"
            "icon_16x16@2x.png"
            "icon_32x32.png"
            "icon_32x32@2x.png"
            "icon_128x128.png"
            "icon_128x128@2x.png"
            "icon_256x256.png"
            "icon_256x256@2x.png"
            "icon_512x512.png"
            "icon_512x512@2x.png"
          )
          ICON_SIZES=(16 32 32 64 128 256 256 512 512 1024)

          for i in "${!ICON_NAMES[@]}"; do
            name="${ICON_NAMES[$i]}"
            sz="${ICON_SIZES[$i]}"
            src="scripts/icons/cdin-${sz}.png"
            if [[ -f "$src" ]]; then
              cp "$src" "$ICONSET/$name"
              echo "  $name ← cdin-${sz}.png"
            else
              echo "::warning::Missing icon source: $src"
            fi
          done

          iconutil -c icns "$ICONSET" -o scripts/cdin.icns
          echo "cdin.icns: $(du -sh scripts/cdin.icns | cut -f1)"

      - name: Build release binary
        run: |
          make -j$(sysctl -n hw.logicalcpu) \
            BUILD=release \
            PLATFORM=macos \
            SDL_VERSION=3 \
            CC=clang
          file build/macos-release/cdin
          echo "BIN=build/macos-release/cdin" >> "$GITHUB_ENV"

      - name: Create .app bundle
        run: |
          APP="dist/cdin.app"
          CONTENTS="$APP/Contents"
          MACOS_DIR="$CONTENTS/MacOS"
          RESOURCES="$CONTENTS/Resources"

          mkdir -p "$MACOS_DIR" "$RESOURCES"

          # Binary
          cp "$BIN" "$MACOS_DIR/cdin"
          chmod 755 "$MACOS_DIR/cdin"

          # Data directory (Lua plugins, themes, fonts…)
          [[ -d data ]] && cp -r data "$MACOS_DIR/"

          # Icon
          [[ -f scripts/cdin.icns ]] && cp scripts/cdin.icns "$RESOURCES/cdin.icns"

          # Bundle libSDL3.dylib so the .app works WITHOUT Homebrew installed
          SDL_LIB="$(pkg-config --variable=libdir sdl3)/libSDL3.dylib"
          if [[ -f "$SDL_LIB" ]]; then
            cp "$SDL_LIB" "$MACOS_DIR/libSDL3.dylib"
            OLD_PATH="$(otool -L "$MACOS_DIR/cdin" | grep SDL3 | awk '{print $1}')"
            install_name_tool \
              -change "$OLD_PATH" \
              "@executable_path/libSDL3.dylib" \
              "$MACOS_DIR/cdin"
            # Also fix the dylib's own id so macOS is happy
            install_name_tool \
              -id "@executable_path/libSDL3.dylib" \
              "$MACOS_DIR/libSDL3.dylib"
            echo "Bundled libSDL3.dylib (patched rpath)"
          else
            echo "::warning::libSDL3.dylib not found – bundle may require SDL3 at runtime"
          fi

          # Determine version for Info.plist
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            PLIST_VERSION="${GITHUB_REF#refs/tags/v}"
          else
            PLIST_VERSION="0.0.0-dev"
          fi

          # Info.plist
          cat > "$CONTENTS/Info.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>              <string>cdin</string>
            <key>CFBundleDisplayName</key>       <string>cdin</string>
            <key>CFBundleIdentifier</key>        <string>io.cdin.editor</string>
            <key>CFBundleVersion</key>           <string>${PLIST_VERSION}</string>
            <key>CFBundleShortVersionString</key> <string>${PLIST_VERSION}</string>
            <key>CFBundleExecutable</key>        <string>cdin</string>
            <key>CFBundleIconFile</key>          <string>cdin</string>
            <key>CFBundlePackageType</key>       <string>APPL</string>
            <key>CFBundleSignature</key>         <string>????</string>
            <key>NSHighResolutionCapable</key>   <true/>
            <key>LSMinimumSystemVersion</key>    <string>12.0</string>
            <key>LSApplicationCategoryType</key> <string>public.app-category.developer-tools</string>
            <key>CFBundleDocumentTypes</key>
            <array>
              <dict>
                <key>CFBundleTypeName</key>      <string>Text File</string>
                <key>CFBundleTypeRole</key>      <string>Editor</string>
                <key>LSItemContentTypes</key>
                <array>
                  <string>public.plain-text</string>
                  <string>public.source-code</string>
                </array>
              </dict>
            </array>
          </dict>
          </plist>
          PLIST

          echo "── App bundle layout ──"
          find "$APP" -type f | sort

      - name: Verify .app binary
        run: |
          BIN_IN_APP="dist/cdin.app/Contents/MacOS/cdin"
          file "$BIN_IN_APP"
          otool -L "$BIN_IN_APP"
          lipo -info "$BIN_IN_APP"

      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VER="${GITHUB_REF#refs/tags/}"
          else
            VER="dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Version: $VER"
      - name: Create DMG installer
        run: |
          VER="${{ steps.version.outputs.version }}"
          DMG_NAME="cdin-${VER}-macos"
          DMG_PATH="dist/${DMG_NAME}.dmg"

          mkdir -p dist

          # create-dmg handles:
          #   - mounting & formatting the image
          #   - placing the .app and the /Applications symlink
          #   - setting window size, icon positions, background
          create-dmg \
            --volname "cdin ${VER}" \
            --volicon "scripts/cdin.icns" \
            --window-pos  200 120 \
            --window-size 660 400 \
            --icon-size   128 \
            --icon        "cdin.app" 180 185 \
            --hide-extension "cdin.app" \
            --app-drop-link  480 185 \
            --no-internet-enable \
            "${DMG_PATH}" \
            "dist/cdin.app"

          echo "DMG: $(du -sh ${DMG_PATH} | cut -f1)"
          echo "DMG_PATH=${DMG_PATH}" >> "$GITHUB_ENV"
          echo "DMG_NAME=${DMG_NAME}"  >> "$GITHUB_ENV"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14

name: Docker

# Pull requests only. A push to main must not build an image:
#   - pre-release.yml is the path that main takes, and it publishes Windows
#     and Linux, never a container;
#   - a stable image is built and published by release.yml on a vX.Y.Z tag.
on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # Validates the Dockerfile (build only, `push: false`); tag releases are
  # published to Docker Hub by release.yml.
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # full history: the version comes from `git describe` inside make
          fetch-depth: 0

      # cdin-x is where the mandatory set lives: the vim plugin, the default
      # theme and the fonts. A cdin build bundles it into build/…/data via
      # scripts/assemble_data.py -> scripts/bundle.py. It is checked out into
      # the build context so the Dockerfile can COPY it; the build itself
      # never fetches anything.
      - name: Checkout cdin-x (mandatory bundle source)
        uses: actions/checkout@v4
        with:
          repository: m-mdy-m/cdin-x
          path: cdin-x

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
